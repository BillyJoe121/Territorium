services:
  - type: web
    name: territorium-web
    runtime: static
    buildCommand: npm ci && npm run verify
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_DATA_MODE
        value: supabase
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_APP_ORIGIN
        sync: false
      - key: VITE_MAX_UPLOAD_MB
        value: 50
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: X-Frame-Options
        value: DENY

  # Free test deployment: this runs the polling loop inside a public web
  # service because Render does not offer free background workers. It may
  # sleep after inactivity and must be upgraded before a production launch.
  - type: web
    name: territorium-worker
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./worker/Dockerfile
    dockerContext: ./worker
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-5.5
      - key: POLL_SECONDS
        value: 5
      - key: LEASE_SECONDS
        value: 300
      - key: WORKER_ENABLED
        value: true
